name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build release zips
        run: |
          chmod +x tools/build-releases.sh
          ./tools/build-releases.sh ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/${{ steps.version.outputs.version }}/kafi-aidlc-${{ steps.version.outputs.version }}-claude-code.zip
            releases/${{ steps.version.outputs.version }}/kafi-aidlc-${{ steps.version.outputs.version }}-kiro.zip
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog section for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"

          # Grab release date from the section header, e.g. "## [0.8.3] · 2026-06-05"
          HEADER=$(grep -m1 "^## \[${VERSION_NO_V}\]" CHANGELOG.md || true)
          RELEASE_DATE=$(echo "$HEADER" | grep -oP '(?<=· )\d{4}-\d{2}-\d{2}' || date -u '+%Y-%m-%d')

          # Extract body between this version's header and the next ## header,
          # skipping code-block content (directory trees, etc.)
          BODY=$(awk -v ver="$VERSION_NO_V" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) found=1; next }
            found && /^```/ { in_code = !in_code; next }
            found && !in_code { print }
          ' CHANGELOG.md | head -35 | sed '/^[[:space:]]*$/d')

          [ -z "$BODY" ] && BODY="See full release notes on GitHub."

          printf '%s' "$RELEASE_DATE" > /tmp/release_date.txt
          printf '%s' "$BODY" > /tmp/changelog_body.txt

      - name: Send Teams notification via Power Automate
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import json, os
          import urllib.request

          version = os.environ['VERSION']
          repo    = os.environ['REPO']
          webhook = os.environ['TEAMS_WEBHOOK_URL']
          release_url = f"https://github.com/{repo}/releases/tag/{version}"

          with open('/tmp/release_date.txt') as f:
              release_date = f.read().strip()
          with open('/tmp/changelog_body.txt') as f:
              changelog = f.read().strip() or "See full release notes on GitHub."

          payload = {
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "msTeams": {"width": "Full"},
                      "body": [
                          # ── Header: logo + title ─────────────────────────────
                          {
                              "type": "ColumnSet",
                              "columns": [
                                  {
                                      "type": "Column",
                                      "width": "auto",
                                      "verticalContentAlignment": "Center",
                                      "items": [{
                                          "type": "Image",
                                          "url": "https://logo.svgcdn.com/logos/github-icon.png",
                                          "size": "Small",
                                          "style": "Default"
                                      }]
                                  },
                                  {
                                      "type": "Column",
                                      "width": "stretch",
                                      "verticalContentAlignment": "Center",
                                      "items": [
                                          {
                                              "type": "TextBlock",
                                              "text": f"KAFI AI-DLC {version} Released",
                                              "size": "Large",
                                              "weight": "Bolder",
                                              "color": "Good",
                                              "wrap": True,
                                              "spacing": "None"
                                          },
                                          {
                                              "type": "TextBlock",
                                              "text": f"Released · {release_date}",
                                              "size": "Small",
                                              "color": "Accent",
                                              "spacing": "None"
                                          }
                                      ]
                                  }
                              ]
                          },
                          {
                              "type": "TextBlock",
                              "separator": True,
                              "text": "What's changed",
                              "weight": "Bolder",
                              "spacing": "Medium"
                          },
                          {
                              "type": "TextBlock",
                              "text": changelog,
                              "wrap": True,
                              "spacing": "Small"
                          }
                      ],
                      "actions": [
                          {
                              "type": "Action.OpenUrl",
                              "title": "View Release on GitHub",
                              "url": release_url
                          }
                      ]
                  }
              }]
          }

          data = json.dumps(payload).encode()
          req  = urllib.request.Request(
              webhook, data=data,
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(req) as resp:
              print(f"Notification sent — HTTP {resp.status}: {resp.read().decode()}")
